<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrBinView · 媒体池预览</title>
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Top Compact Toolbar -->
    <header class="topbar">
      <div class="topbar-left">
        <button id="btn-toggle-sidebar" type="button" class="icon-btn is-active" title="显示 / 隐藏左侧文件夹树"></button>
        <div class="nav-group">
          <button id="btn-back" type="button" class="icon-btn" title="后退 (Alt+←)" disabled></button>
          <button id="btn-forward" type="button" class="icon-btn" title="前进 (Alt+→)" disabled></button>
          <button id="btn-up" type="button" class="icon-btn" title="上一级文件夹" disabled></button>
        </div>
        <div id="project-pill" class="project-pill" title="当前连接的 Premiere Pro 工程">连接中…</div>
      </div>

      <div class="topbar-center">
        <div class="search-box">
          <span id="search-icon" class="search-icon"></span>
          <input id="search-input" type="text" placeholder="搜索素材名称或路径… (Ctrl+F)" autocomplete="off" spellcheck="false" />
          <button id="btn-search-clear" type="button" class="search-clear hidden" title="清空搜索">×</button>
        </div>
        <button id="toggle-global-search" type="button" class="pill-toggle" title="开启后搜索整个工程，关闭时仅搜索当前文件夹">全工程</button>
      </div>

      <div class="topbar-right">
        <button id="btn-new-bin" type="button" class="btn" title="在当前素材箱中新建素材箱"></button>
        <button id="btn-import" type="button" class="btn" title="导入媒体文件…"></button>
        <button id="btn-import-folder" type="button" class="btn" title="导入本地文件夹（保留子目录结构）…"></button>
        <button id="btn-refresh" type="button" class="icon-btn" title="刷新项目面板 (F5)"></button>
        <button id="btn-lang" type="button" class="lang-btn" title="切换界面语言（中文 / English）"><span class="lang-opt lang-zh is-on">中</span><span class="lang-sep">/</span><span class="lang-opt lang-en">EN</span></button>
      </div>
    </header>

    <!-- Browser Demo Notice (Hidden inside Premiere Pro) -->
    <div id="demo-strip" class="demo-strip hidden">
      <span id="demo-strip-text">浏览器界面预览模式 · 单击任意素材箱体验即时切换；安装到 Premiere Pro 后自动连接真实项目与 FFmpeg 缩略图引擎</span>
    </div>

    <!-- Main Single-Panel Split Workspace -->
    <div class="workspace">
      <!-- Left Collapsible Folder Tree -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
          <span id="sidebar-title" class="sidebar-title">项目素材箱</span>
          <div class="sidebar-sort">
            <select id="tree-sort-select" class="select mini-select" title="素材箱排序方式">
              <option value="name">名称</option>
              <option value="count">数量</option>
              <option value="label">标签</option>
              <option value="order">原序</option>
            </select>
            <button id="btn-tree-sort-dir" type="button" class="icon-btn mini" title="排序：升序（点击切换降序）">↑</button>
          </div>
        </div>
        <div id="folder-tree" class="folder-tree" tabindex="-1"></div>
        <div class="sidebar-foot">
          <label id="sidebar-size-wrap" class="size-control sidebar-size-control" title="实时调节左侧素材箱列表尺寸">
            <span id="sidebar-size-label">尺寸</span>
            <input id="tree-size" type="range" min="22" max="44" step="1" value="27" />
          </label>
        </div>
      </aside>

      <div id="sidebar-splitter" class="splitter" title="拖动调整侧栏宽度"></div>

      <!-- Center Instant Media Thumbnail Stage -->
      <section class="stage">
        <div class="stage-bar">
          <div class="stage-bar-left">
            <nav id="breadcrumbs" class="breadcrumbs" aria-label="当前路径"></nav>
            <button id="toggle-subfolders" type="button" class="pill-toggle" title="平铺显示当前文件夹及其所有子文件夹中的素材">含子箱</button>
          </div>

          <div class="stage-bar-right">
            <div id="type-filters" class="chip-group" role="tablist">
              <button type="button" class="chip is-active" data-type="all">全部</button>
              <button type="button" class="chip" data-type="video">视频</button>
              <button type="button" class="chip" data-type="image">图片</button>
              <button type="button" class="chip" data-type="audio">音频</button>
              <button type="button" class="chip" data-type="sequence">序列</button>
            </div>

            <div class="view-group">
              <button id="btn-col-settings" type="button" class="icon-btn compact" title="自定义顶部排序与列表显示列"></button>
              <button id="btn-view-grid" type="button" class="icon-btn compact is-active" title="缩略图网格视图"></button>
              <button id="btn-view-list" type="button" class="icon-btn compact" title="详细列表视图（显示帧率/起止时间/参数）"></button>
            </div>
          </div>
        </div>

        <div id="grid-scroll" class="grid-scroll" tabindex="-1">
          <div id="col-header" class="col-header" role="row"></div>
          <div id="grid" class="grid"></div>
          <div id="grid-empty" class="grid-empty hidden"></div>
        </div>
      </section>
    </div>

    <!-- Bottom Slim Status Bar -->
    <footer class="statusbar">
      <div class="status-left">
        <span id="status-count" class="status-count">0 项</span>
        <span class="status-sep">·</span>
        <span id="status-text" class="status-text">就绪</span>
      </div>
      <div class="status-right">
        <span id="version-badge" class="version-badge" title="PrBinView 插件版本">v1.3.8</span>
        <span id="engine-badge" class="engine-badge" title="缩略图解码引擎">检测中</span>
        <button id="btn-sync-toggle" type="button" class="sync-pill is-active" title="单击 Pr 项目面板素材箱自动同步到本面板，反之亦然">
          <span class="sync-dot"></span>
          <span id="sync-label">双向联动：开</span>
        </button>
        <button id="btn-clear-cache" type="button" class="link-btn" title="清理本地临时缩略图缓存">清缓存</button>
        <label id="status-size-wrap" class="size-control" title="实时缩放缩略图尺寸">
          <span id="status-size-label">尺寸</span>
          <input id="thumb-size" type="range" min="120" max="320" step="4" value="184" />
        </label>
      </div>
    </footer>

    <!-- External OS File/Folder Drag-and-Drop Banner -->
    <div id="external-drop-banner" class="external-drop-banner hidden"></div>
  </div>

  <!-- Context Menu & Floating Submenu -->
  <div id="context-menu" class="context-menu hidden" role="menu"></div>
  <div id="context-submenu" class="context-menu context-submenu hidden" role="menu"></div>

  <!-- Column Visibility Popover -->
  <div id="col-popover" class="col-popover hidden"></div>

  <!-- Lightweight Modal Dialog -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" type="button" class="btn">取消</button>
        <button id="modal-ok" type="button" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cep-bridge.js"></script>
  <script src="js/thumb-engine.js"></script>
  <script src="js/tree-view.js"></script>
  <script src="js/grid-view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
